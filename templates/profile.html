<!DOCTYPE html>
<html>

<head>

    <title>AI Bridge - Profile</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👤 AI Bridge Profile</h1>

    <p>
        Create your profile so AI Bridge can understand you better.
    </p>

    <form method="POST" action="/profile">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Department</label>

        <select name="department">

            <option value="">Select Department</option>

            <option value="CSE">CSE</option>

            <option value="ECE">ECE</option>

            <option value="EEE">EEE</option>

            <option value="Mechanical">Mechanical</option>

            <option value="Civil">Civil</option>

        </select>

        <label>Year</label>

        <select name="year">

            <option value="">Select Year</option>

            <option value="1st Year">1st Year</option>

            <option value="2nd Year">2nd Year</option>

            <option value="3rd Year">3rd Year</option>

            <option value="4th Year">4th Year</option>

        </select>

        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Example: Salem"
        >

        <button type="submit">
            🚀 Create Profile
        </button>

    </form>

    <a class="back" href="/">
        🏠 Back to AI Bridge
    </a>

</div>

</body>

</html>
